# =====================================================================
# docker-compose.yml - ITJobs Frontend (Next.js 15 Standalone)
# Dùng khi muốn chạy riêng Frontend qua Docker
# =====================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.devjobs.click}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://devjobs.click}
        NEXT_PUBLIC_API_TINYMCE: ${NEXT_PUBLIC_API_TINYMCE:-}
        JWT_SECRET: ${JWT_SECRET:-}
    image: itjobs-fe:latest
    container_name: itjobs-fe
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      PORT: 3000
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

